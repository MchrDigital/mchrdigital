<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 60" role="img" aria-label="M&amp;H Scale">
  <g font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">

    <!-- M&H — lighter weight, sits inline -->
    <text x="0" y="42"
          font-size="30"
          font-weight="400"
          letter-spacing="-0.5">
      M&amp;H
    </text>

    <!-- SCALE — the emphasis, heavier and tighter -->
    <text x="82" y="42"
          font-size="30"
          font-weight="800"
          letter-spacing="-1">
      SCALE
    </text>

  </g>
</svg>
